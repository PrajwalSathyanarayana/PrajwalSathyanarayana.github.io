<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page not found — Prajwal Sathyanarayana</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f8fafc" />
  <script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0b1120':'#f8fafc';})();</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Georgia,serif' font-style='italic' font-size='34' fill='%23818cf8'%3EPS%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet"/>
</head>
<body class="not-found">
  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark theme"><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <main class="tile tile-hero not-found-tile">
    <span class="tile-kicker">Error 404</span>
    <h1 class="bento-name">Page <em>not found</em></h1>
    <p class="bento-bio">This address doesn&rsquo;t exist on the site. It may have moved, or the link had a typo.</p>
    <div class="bento-actions">
      <a href="/" class="bento-btn">&larr; Back to the homepage</a>
      <a href="/#projects" class="bento-btn is-ghost">View projects</a>
    </div>
  </main>
  <script>
    document.getElementById('themeToggle').addEventListener('click', function () {
      var t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0b1120' : '#f8fafc';
      try { localStorage.setItem('theme', t); } catch (e) {}
    });
  </script>
</body>
</html>
